name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - name: Linux x86-64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: vesper
            archive: vesper-${{ github.ref_name }}-linux-x86_64.tar.gz

          - name: Windows x86-64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: vesper.exe
            archive: vesper-${{ github.ref_name }}-windows-x86_64.zip

          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            binary: vesper
            archive: vesper-${{ github.ref_name }}-macos-x86_64.tar.gz

          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            binary: vesper
            archive: vesper-${{ github.ref_name }}-macos-arm64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir package
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" package/

          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            7z a "${{ matrix.archive }}" ./package/*
          else
            tar -czf "${{ matrix.archive }}" -C package .
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}